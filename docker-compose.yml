version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance_pgvector
    environment:
      POSTGRES_DB: insurance_help_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - insurance_pg_data:/var/lib/postgresql/data

volumes:
  insurance_pg_data: